<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SOYL Forms</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f5f1; --ink: #101012; --soft: #55534e; --accent: #f2b418; --accent-ink: #1a1400; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0e; --ink: #f4f3ee; --soft: #aba89f; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 340px; }
      h1 { font-size: 26px; line-height: 1.15; margin: 20px 0 10px; letter-spacing: -0.02em; }
      p { color: var(--soft); font-size: 16px; line-height: 1.5; margin: 0; }
      button { margin-top: 28px; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 600;
        background: var(--accent); color: var(--accent-ink); }
      svg { width: 44px; height: 44px; color: var(--soft); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0" /><circle cx="12" cy="19" r="1" /><path d="M3 3l18 18" />
      </svg>
      <h1>You’re offline</h1>
      <p>SOYL Forms needs an internet connection. Check your connection and try again.</p>
      <button type="button" onclick="location.replace('{{START_URL}}')">Try again</button>
    </main>
  </body>
</html>
